services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ticketdb
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpass}
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-rootpass}"]
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://db:3306/ticketdb?useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpass}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-change-me-now}
    ports: ["80:8080"]
    restart: unless-stopped
volumes:
  dbdata:
